name: CI
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main ]

jobs:
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate, test and package contract
        run: mvn -B -ntp clean verify

  call-lite:
    needs: contract-tests
    uses: pauszek/fsamp-code-ci/.github/workflows/build-lite.yml@fd553ff9598c1d8548cb808b15b967c1610ccfc4
    secrets:
      GABRBA_SECRET: ${{ secrets.GABRBA_SECRET }}
