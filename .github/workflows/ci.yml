name: CI
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main ]

jobs:
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate, test and package contract
        run: mvn -B -ntp clean verify

  call-lite:
    needs: contract-tests
    uses: pauszek/fsamp-code-ci/.github/workflows/build-lite.yml@3be5121f484722007182b432327f9a6a27d32458
    secrets:
      GABRBA_SECRET: ${{ secrets.GABRBA_SECRET }}
