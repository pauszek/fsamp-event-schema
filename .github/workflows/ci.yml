name: CI
on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ main ]

jobs:
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate, test and package contract
        run: mvn -B -ntp clean verify

  call-lite:
    needs: contract-tests
    uses: pauszek/fsamp-code-ci/.github/workflows/build-lite.yml@3be5121f484722007182b432327f9a6a27d32458
    secrets:
      GABRBA_SECRET: ${{ secrets.GABRBA_SECRET }}
